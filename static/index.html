<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Box</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <h1>Music Box</h1>
    <p>Drag and drop music from your computer to play on the music box</p>
    <canvas id="mycanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>
    <audio controls></audio>
    <button>Add Song</button>
    <button>Log in</button>
    <button>Public Playlist</button>
    <button>User Playlist</button>

    <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/a8dgNdJVluc"
    title="Video link"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media;"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
    ></iframe>
    <form
      enctype="multipart/form-data"
      action="http://localhost:8080/api/uploadMP3"
      method="post"
    >
    <label>
      Upload Mp3 
    
      <input type="file" name="uploadedFile" />
      <button type="submit">Submit</button>
      </label>
    </form>
     <form
      enctype="multipart/form-data"
      action="http://localhost:8080/api/playlists"
      method="post"
    >
    <label>Create a Playlist
      <input type="text" name="name"/>
    </label for="name">Name of playlist</label>
      <fieldset>
        <legend>Would you like this playlist to be public?</legend>
      <input type="radio" id="yes" value="yes"/>
      <label for="yes">Yes</label>
      <input type="radio" id="no" value="no"/>
      <label for="no">No</label>
      <button type="submit">Submit</button> 
      </fieldset>
      <fieldset>
        <legend>Would you like this playlist to be edited by others?</legend>
      <input type="radio" id="yes" value="yes"/>
      <label for="yes">Yes</label>
      <input type="radio" id="no" value="no"/>
      <label for="no">No</label>
      <button type="submit">Submit</button> 
      </fieldset>
      </label>
      <script> fetch="api/playlists"</script>
    </form>

     <div id="auth-section">
      <h2>Login</h2>
      <form id="login-form">
        <input
          class="input-area"
          type="email"
          id="email"
          placeholder="Email"
          required
        />
        <input
          class="input-area"
          type="password"
          id="password"
          placeholder="Password"
          required
        />
        <div class="button-container">
          <button type="submit">Login</button>
          <button onclick=signup() type="button">Signup</button>
        </div>
      </form>
    </div>
  </body>
</html>
