<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusicBox</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js" defer></script>
</head>
<body>

  <h1>MusicBox</h1>

  <div id="auth-section">
      <h2>Login</h2>
      <form id="login-form">
        <input
          class="input-area"
          type="email"
          id="email"
          placeholder="Email"
          required
        />
        <input
          class="input-area"
          type="password"
          id="password"
          placeholder="Password"
          required
        />
        <div class="button-container">
          <button type="button" id="login">Login</button>
          <button type="button" id="signup">Signup</button>
        </div>
      </form>
    </div>

    <div id="after-login">
      
    <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/a8dgNdJVluc"
    title="Video link"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media;"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
    ></iframe>
    
    <form
      enctype="multipart/form-data"
      action="http://localhost:8080/api/uploadMP3"
      method="post"
      >
    <label>
      Upload Mp3 
    
      <input type="file" name="uploadedFile" />
      <button type="submit">Submit</button>
      </label>
    </form>

    <form id="create-playlist">
      <input type="text" id ="name" placeholder="Boot's secret metal collection"></input>
      <input type="checkbox" id="public"></input>
      <input type="checkbox" id="collab"></input>
      <button type="button" id="create-playlist-button"> </button>
      <button type="button" id="yay-button">
    </form>
    <button id="logout">Logout</button>
    </div>
    <div id="Yay-buton">
        <button>Yay
          <script src="https://cdn.jsdelivr.net/npm/@hiseb/confetti@2.2.0/dist/confetti.min.js"></script>
          <script>
            confetti();
          </script>
        </button>
    </div>
</body>
</html>
