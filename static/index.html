<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Document</title>
  </head>
  <body>
    <form
      enctype="multipart/form-data"
      action="http://localhost:8080/api/uploadMP3"
      method="post"
    >
      <input type="file" name="uploadedFile" />
      <input type="submit" value="upload" />
    </form>
  </body>
</html>
  <head>
    <meta charset="UTF-8">
    <title>Web Music Box</title>
  </head>
  <body>
    <h1>Music Box</h1>
    <p>Drag and drop music from your computer to play on the music box</p>
    <canvas id="mycanvas" width="200" height="100" style="border:1px solid #000000;"></canvas>
    <audio controls></audio>
    <button>Add Song</button>
    <button>Log in</button>
    <button>Public Playlist</button>
    <button>User Playlist</button>

    <iframe
    width="560"
    height="315"
    src="https://www.youtube.com/embed/a8dgNdJVluc"
    title="Video link"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media;"
    referrerpolicy="strict-origin-when-cross-origin"
    allowfullscreen
    ></iframe>
  </body>
</html>
